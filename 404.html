<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>404 — Page not found — mkalmousli</title>
    <meta name="description" content="That page doesn't exist on al-mo.de.">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="/assets/mk.svg">
    <link rel="apple-touch-icon" href="/assets/mk.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap"
        rel="stylesheet">
    <style>
        .err {
            text-align: center;
        }
        .err-code {
            font-size: clamp(4rem, 20vw, 8rem);
            font-weight: 700;
            line-height: 1;
            margin: 0;
        }
        .err h1 {
            font-size: clamp(1.1rem, 4vw, 1.5rem);
            margin: .6rem 0 1rem;
        }
        .err p {
            color: var(--text-dim);
            margin-bottom: 2rem;
        }
        .err .cta-row {
            justify-content: center;
        }
    </style>
</head>

<body>
    <main id="content" class="doc err">
        <a class="doc-home" href="/"><img src="/assets/mk.svg" alt="mkalmousli" width="40" height="40" /></a>
        <p class="err-code">404</p>
        <h1>Page not found</h1>
        <p>The page you asked for isn't here &mdash; it may have moved, or never existed.</p>
        <div class="cta-row">
            <a class="btn primary" href="/">Go home</a>
            <a class="btn" href="https://github.com/mkalmousli/mkalmousli.github.io" rel="noopener">View source</a>
        </div>
    </main>
</body>

</html>
